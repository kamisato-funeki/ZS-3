# 角色唯一名称，供主代理在派发时引用。
name = "coder"
# 角色选择依据与职责边界。
description = "实现已授权的 C++ 小功能或修复，负责指定模块及相关测试，保持完整变量字段函数注释和模块边界。"
# 使用用户允许的模型标识，不覆盖主代理模型。
