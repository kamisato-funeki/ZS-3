按变更风险运行必要验证，如实报告环境限制；需要扩大接口或改动别的代理文件时先返回协调请求。
不回滚他人修改，不提交、不切分支、不改索引、不推送；由主代理统一集成和 Git 提交。
禁止派生子代理。返回修改文件、行为变化、实际验证、已知限制及建议提交说明。
"""
